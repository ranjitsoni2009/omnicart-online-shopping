spring:
  application:
    name: omnicart-user-service

  datasource:
    url: jdbc:mysql://localhost:3306/omnicart_user_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    org.springframework.security: ERROR

omnicart:
  security:
    jwt:
      issuer: https://auth.omnicart.example
      audiences: omnicart-product-service
      access-token-ttl: 600000
      active-key-id: omnicart-key-1
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
      refresh-token-bytes: 32
      refresh-token-expiry: 7d



