spring:
  application:
    name: omnicart-product-service
  datasource:
    url: jdbc:mysql://localhost:3306/omnicart_product_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public_key.pem

omnicart:
  security:
    jwt:
      issuer: https://auth.omnicart.example
      audience: omnicart-product-service

